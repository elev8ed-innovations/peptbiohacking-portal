# Netlify config — PeptBiohacking Portal (peptbiohacking.mx)
# Deploy Previews: auto-built for every branch pushed to GitHub
# Preview URL pattern: https://{branch-name}--pept-app.netlify.app

[build]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Production
[context.production]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

# Deploy Preview: every branch push auto-builds with full env
[context.deploy-preview]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

# Branch Deploy: same config
[context.branch-deploy]
  command = "node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

# SPA catch-all — serve index.html for all client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
